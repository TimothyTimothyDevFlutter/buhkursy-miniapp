# Настройки для выкладки Worker командой, без копирования кода мышкой.
#
# Зачем: вставка кода в панель Cloudflare требует нажать Deploy отдельно,
# и если этого не сделать, в работе остаётся старая версия. Команда
# выкладывает сразу и молча не ошибается.
#
# Как пользоваться (из папки worker):
#   npx wrangler login     — один раз, откроет браузер для входа
#   npx wrangler deploy    — каждый раз, когда меняли zayavki.js
#
# Токен бота здесь НЕ хранится. Он лежит в Cloudflare как секрет
# и при выкладке сохраняется — заново вводить не нужно.

name = "zayavki"
main = "zayavki.js"
compatibility_date = "2025-01-01"

# Обычная переменная: кому слать заявки.
# Её нужно объявить здесь, иначе выкладка командой сотрёт ту,
# что задана в панели, и заявки перестанут доходить.
[vars]
CHAT_ID = "6029626760"
