<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<!-- viewport-fit=cover разрешает странице заезжать под вырез камеры
     и под жестовую полосу внизу. Отступы от них расставит styles.css. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Говорим телефону: у страницы светлое оформление, затемнять не нужно -->
<meta name="color-scheme" content="light">

<title>Счёт и порядок — курсы бухгалтерского учёта</title>

<!-- Превью ссылки. Когда этот адрес отправляют в чат, мессенджер читает
     эти строки и показывает карточку с картинкой и описанием вместо
     голого адреса. Меняется здесь, а не в data.js: это про саму ссылку,
     а не про содержимое страницы. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Счёт и порядок — курсы бухгалтерского учёта">
<meta property="og:description" content="Два курса: бухгалтер с нуля и 1С:Бухгалтерия 8.3. Программа, расписание дня, цены и телефоны для записи.">
<meta property="og:image" content="https://timothytimothydevflutter.github.io/buhkursy-miniapp/preview.png">
<meta property="og:url" content="https://timothytimothydevflutter.github.io/buhkursy-miniapp/">
<meta name="description" content="Курсы бухгалтерского учёта: с нуля и 1С 8.3. Программа, расписание, цены и телефоны для записи.">

<!-- Шрифты подгружаются из интернета -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<!-- Оформление: цвета, шрифты, отступы -->
<link rel="stylesheet" href="styles.css">

<!-- Библиотека Telegram. Даёт странице связь с мессенджером: развернуть окно,
     показать встроенную кнопку, включить вибрацию, узнать имя человека.
     В обычном браузере она тоже загрузится, но останется без дела —
     страница это проверяет и работает как раньше. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<!--
  Этот файл — только каркас: перечень блоков и их порядок сверху вниз.
  Текстов здесь нет намеренно. Каждый блок ниже пустой, его наполняет
  скрипт app.js, беря содержимое из data.js.

  Менять что-то здесь нужно, только если вы хотите переставить блоки
  местами или убрать целый блок со страницы.
-->
<body>
<div class="app">

  <!-- ПРИВЕТСТВИЕ: логотип, заголовок, три цифры -->
  <header class="hero" data-block="hero"></header>

  <!-- КУРСЫ: раскрывающиеся строки с программой -->
  <section data-block="courses"></section>

  <!-- РАСПИСАНИЕ: часы работы и занятия по времени -->
  <section data-block="schedule"></section>

  <!-- СТОИМОСТЬ: группа и индивидуально -->
  <section data-block="prices"></section>

  <!-- КОНТАКТЫ: люди и телефоны -->
  <div class="contacts" data-block="contacts"></div>

  <!-- ЗАЯВКА: для тех, кто не готов звонить.
       Показывается, только если в data.js заполнен адрес приёмника. -->
  <section data-block="form" hidden></section>

  <!-- Подпись мелким шрифтом внизу -->
  <footer data-block="footer"></footer>

  <!-- Кнопка, прилипшая к нижнему краю экрана.
       Внутри Telegram прячется — там показывается встроенная кнопка мессенджера. -->
  <div class="bar" data-block="cta"></div>

</div>

<!-- Порядок важен: сначала содержимое, потом скрипт, который его расставляет -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
